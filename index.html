<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>shalaREPO</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1BC0BC;
            --secondary: #ff766a;
            --bg-light: #f8f9fa;
            --bg-dark: #121212;
            --text-light: #333;
            --text-dark: #f4f4f4;
            --card-bg-light: #ffffff;
            --card-bg-dark: #1e1e1e;
            --spacing: clamp(16px, 3vw, 24px);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Urbanist', sans-serif;
            background-color: var(--bg-light);
            color: var(--text-light);
            text-align: center;
            margin: 0;
            padding: var(--spacing);
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            transition: background-color 0.5s ease, color 0.5s ease;
            perspective: 1000px;
        }

        @media (prefers-color-scheme: dark) {
            body {
                background-color: var(--bg-dark);
                color: var(--text-dark);
            }
        }

        .content {
            position: relative;
            z-index: 10;
            background: rgba(255, 255, 255, 0.7);
            padding: calc(var(--spacing) * 2) var(--spacing);
            border-radius: 40px;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            box-shadow: 0 20px 50px rgba(0,0,0,0.1);
            width: min(90vw, 480px);
            border: 1px solid rgba(255,255,255,0.3);
            display: flex;
            flex-direction: column;
            gap: var(--spacing);
            transition: transform 0.1s ease-out;
            transform-style: preserve-3d;
        }

        @media (prefers-color-scheme: dark) {
            .content {
                background: rgba(30, 30, 30, 0.7);
                box-shadow: none;
                border: 1px solid rgba(255,255,255,0.1);
            }
        }

        .icon-container {
            width: clamp(80px, 20vw, 100px);
            height: clamp(80px, 20vw, 100px);
            margin: 0 auto;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            transform: rotate(calc(-3deg + var(--extra-rotation, 0deg)));
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            cursor: pointer;
        }

        .icon-container:hover, .icon-container:active {
            transform: rotate(calc(3deg + var(--extra-rotation, 0deg))) scale(1.1);
        }

        .icon-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        h1 {
            font-size: clamp(2rem, 10vw, 2.8rem);
            font-weight: 800;
            margin: 0;
            letter-spacing: -1.5px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .buttons {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: calc(var(--spacing) * 0.5);
        }

        a {
            text-decoration: none;
            padding: 14px 30px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            color: white;
            position: relative;
        }

        a:active {
            transform: scale(0.95);
            filter: brightness(0.9);
        }

        .btn-emoji {
            position: absolute;
            left: 20px;
            font-size: 1.1rem;
        }

        .btn-sileo {
            background-color: var(--primary);
        }

        .btn-sileo:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(27, 192, 188, 0.3);
            filter: brightness(1.1);
        }

        .btn-zebra {
            background-color: #444;
        }

        .btn-zebra:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
            filter: brightness(1.2);
        }

        .footer-info {
            display: flex;
            flex-direction: column;
            gap: calc(var(--spacing) * 0.4);
            align-items: center;
        }

        .badge {
            display: inline-block;
            padding: 6px 16px;
            border-radius: 50px;
            background: rgba(0,0,0,0.05);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--secondary);
        }

        @media (prefers-color-scheme: dark) {
            .badge {
                background: rgba(255,255,255,0.1);
            }
        }

        .emoji {
            position: absolute;
            top: -50px;
            font-size: 2rem;
            opacity: 0.6;
            animation: fall linear forwards;
            pointer-events: auto;
            cursor: pointer;
            z-index: 1;
        }

        @keyframes fall {
            0% { transform: translateY(0) rotate(0deg); }
            100% { transform: translateY(110vh) rotate(360deg); }
        }

        .explosion {
            position: absolute;
            font-size: 2.5rem;
            pointer-events: none;
            animation: explode 0.6s ease-out forwards;
            z-index: 5;
        }

        @keyframes explode {
            0% { transform: scale(0.5); opacity: 1; }
            50% { transform: scale(1.5); opacity: 0.8; }
            100% { transform: scale(2); opacity: 0; }
        }

        .support-text {
            color: var(--secondary);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.6; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.05); }
        }

	        .visit-counter {
	            position: fixed;
	            top: 20px;
	            right: 20px;
	            font-size: 0.75rem;
	            font-weight: 600;
	            color: var(--text-light);
	            opacity: 0.08;
	            transition: opacity 0.25s ease;
	            z-index: 1000;
	            background: rgba(255, 255, 255, 0.2);
	            padding: 4px 10px;
	            border-radius: 20px;
	            backdrop-filter: blur(5px);
	            -webkit-backdrop-filter: blur(5px);
	            pointer-events: auto;
	            cursor: default;
	        }

	        .visit-counter:hover {
	            opacity: 1;
	        }

        @media (prefers-color-scheme: dark) {
            .visit-counter {
                color: var(--text-dark);
                background: rgba(255, 255, 255, 0.05);
            }
        }

    </style>
	</head>
	<body>
	    <div class="visit-counter" id="visit-counter">...</div>
	    <div class="content">
        <div class="icon-container">
            <img src="CydiaIcon.png" alt="shalaREPO Icon">
        </div>
        <h1>shalaREPO</h1>
        
        <div class="buttons">
            <a href="sileo://source/https://shalamand3r.github.io/" class="btn-sileo">
                <span class="btn-emoji">📦</span>
                <span>Add to Sileo</span>
            </a>
            <a href="zbra://sources/add/https://shalamand3r.github.io/" class="btn-zebra">
                <span class="btn-emoji">🦓</span>
                <span>Add to Zebra</span>
            </a>
        </div>

        <div class="footer-info">
            <div style="opacity: 0.5;">Compatible with iOS 15.0 - 17.0</div>
        </div>
    </div>

    <script>
        const emojis = ['🍆'];
        let cursorX = 0;
        let cursorY = 0;

        const updateCursor = (x, y) => {
            cursorX = x;
            cursorY = y;
        };

        document.addEventListener('mousemove', (e) => updateCursor(e.clientX, e.clientY));
        document.addEventListener('touchstart', (e) => updateCursor(e.touches[0].clientX, e.touches[0].clientY));
        document.addEventListener('touchmove', (e) => {
            updateCursor(e.touches[0].clientX, e.touches[0].clientY);
        });

        const icon = document.querySelector('.icon-container');
        const card = document.querySelector('.content');
        let currentRotation = 0;

        const handleParallax = (x, y) => {
            const rotateX = (y - window.innerHeight / 2) / 250;
            const rotateY = -(x - window.innerWidth / 2) / 250;
            card.style.transform = `rotateX(${-rotateX}deg) rotateY(${-rotateY}deg)`;
        };

        document.addEventListener('mousemove', (e) => {
            updateCursor(e.clientX, e.clientY);
            if (window.innerWidth > 768) handleParallax(e.clientX, e.clientY);
        });

        document.addEventListener('touchstart', (e) => {
            updateCursor(e.touches[0].clientX, e.touches[0].clientY);
        });

        document.addEventListener('touchmove', (e) => {
            updateCursor(e.touches[0].clientX, e.touches[0].clientY);
        });

        icon.addEventListener('click', () => {
            currentRotation += 720;
            icon.style.setProperty('--extra-rotation', `${currentRotation}deg`);
        });

        function createEmoji() {
            const emoji = document.createElement('div');
            emoji.className = 'emoji';
            emoji.textContent = emojis[Math.floor(Math.random() * emojis.length)];
            
            const startX = Math.random() * window.innerWidth;
            emoji.style.left = startX + 'px';
            
            const duration = Math.random() * 4 + 3;
            emoji.style.animationDuration = duration + 's';
            
            document.body.appendChild(emoji);

            const pop = () => {
                explode(parseFloat(emoji.style.left), emoji.getBoundingClientRect().top);
                emoji.remove();
            };
            
            emoji.addEventListener('mousedown', pop);
            emoji.addEventListener('touchstart', (e) => {
                e.preventDefault();
                pop();
            });

            const checkCollision = setInterval(() => {
                const rect = emoji.getBoundingClientRect();
                const topElement = document.elementFromPoint(cursorX, cursorY);

                if (topElement === emoji && 
                    cursorX > rect.left && cursorX < rect.right && 
                    cursorY > rect.top && cursorY < rect.bottom) {
                    explode(rect.left + rect.width/2, rect.top + rect.height/2);
                    emoji.remove();
                    clearInterval(checkCollision);
                }
            }, 50);

            emoji.addEventListener('animationend', () => {
                clearInterval(checkCollision);
                emoji.remove();
            });
        }

        function explode(x, y) {
            const explosion = document.createElement('div');
            explosion.className = 'explosion';
            explosion.textContent = '💥';
            explosion.style.left = (x - 20) + 'px';
            explosion.style.top = (y - 20) + 'px';
            document.body.appendChild(explosion);
            
            setTimeout(() => explosion.remove(), 600);
        }

        setInterval(createEmoji, 800);

        async function initCounter() {
            const counterEl = document.getElementById('visit-counter');
            const namespace = 'shalamand3r-repo';
            const key = 'visits';
            
            const img = new Image();
            img.src = `https://api.counterapi.dev/v1/${namespace}/${key}/up`;
            
            try {
                const response = await fetch(`https://api.counterapi.dev/v1/${namespace}/${key}`);
                if (!response.ok) throw new Error('Blocked');
                const data = await response.json();
                counterEl.textContent = `Visits: ${data.count.toLocaleString()}`;
                counterEl.style.opacity = '0.6';
            } catch (err) {
                counterEl.textContent = 'Welcome!';
                counterEl.style.opacity = '0';
                counterEl.style.pointerEvents = 'none';
            }
        }
	        initCounter();
    </script>
</body>
</html>
